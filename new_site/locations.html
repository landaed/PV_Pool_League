<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PV Pool League — Locations</title>
  <link rel="icon" href="../assets/favicon_io/favicon.ico" type="image/x-icon">
  <style>
    :root{ --bg:#0b0b0b; --fg:#fff; --muted:#cbd5e1; --line:#2b2b2b; --accent:#0a7cff; --nav-h:84px; }
    *,*::before,*::after{ box-sizing:border-box; }
    html,body{ margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif; }
    #navBar{ position:fixed; inset:0 0 auto 0; height:var(--nav-h); background:#323232;
      z-index:1000; display:flex; align-items:center; justify-content:center; }
    #navBar img{ max-height:calc(var(--nav-h) - 16px); padding:6px 12px; }
    .wrap{ max-width:1100px; margin:0 auto; padding:calc(var(--nav-h) + 24px) 20px 60px; }
    h1{ text-align:center; }
    .region{ margin:32px 0; }
    .region h2{ font-size:1.8rem; text-transform:uppercase; color:var(--accent); margin:0 0 14px;
      border-bottom:1px solid var(--line); padding-bottom:8px; }
    .loc-list{ list-style:none; margin:0; padding:0; display:grid; gap:10px;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
    .loc{ background:#161616; border:1px solid var(--line); border-radius:10px; padding:14px; }
    .loc .name{ font-weight:600; }
    .loc .addr{ color:var(--muted); font-size:14px; margin-top:4px; }
    .loc iframe{ width:100%; height:220px; border:0; border-radius:8px; margin-top:10px; }
    .empty{ color:var(--muted); }
    footer{ color:#9aa6b6; text-align:center; padding:40px 16px; border-top:1px solid var(--line); }
    a.home{ color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div id="navBar">
    <a href="index.html"><img src="../assets/images/PV-Pool-League.png" alt="PV Pool League"></a>
  </div>
  <div class="wrap">
    <h1>Locations</h1>
    <p style="text-align:center;"><a class="home" href="index.html">← Home</a></p>
    <div id="content"><p class="empty" style="text-align:center;">Loading locations…</p></div>
  </div>
  <footer>
    <p>&copy; A division of Landa Investments Ltd.</p>
    <p>&copy; Unbounded Research And Development Corp. All rights reserved.</p>
  </footer>

  <script>
    function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    // Accept either a bare embed URL or a full <iframe ...> snippet stored by the admin.
    function embedHtml(raw){
      if(!raw) return '';
      const t = raw.trim();
      if(t.startsWith('<iframe')) return t;
      return `<iframe src="${esc(t)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`;
    }
    (async () => {
      const content = document.getElementById('content');
      try {
        const res = await fetch('api/public.php?action=all_locations');
        const data = await res.json();
        const regions = (data.regions || []).filter(r => (r.locations||[]).length);
        if (!regions.length) { content.innerHTML = '<p class="empty" style="text-align:center;">No locations posted yet — check back soon.</p>'; return; }
        content.innerHTML = regions.map(r => `
          <section class="region">
            <h2>${esc(r.name)}</h2>
            <ul class="loc-list">
              ${r.locations.map(l => `
                <li class="loc">
                  <div class="name">${esc(l.name)}</div>
                  ${l.address ? `<div class="addr">${esc(l.address)}</div>` : ''}
                  ${embedHtml(l.map_embed)}
                </li>`).join('')}
            </ul>
          </section>`).join('');
      } catch (e) {
        content.innerHTML = '<p class="empty" style="text-align:center;">Could not load locations.</p>';
      }
    })();
  </script>
</body>
</html>
