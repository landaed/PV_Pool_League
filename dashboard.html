<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PV Pool League — Admin Dashboard</title>
  <link rel="icon" href="assets/favicon_io/favicon.ico" type="image/x-icon">
  <style>
    :root{ --primary:#2563eb; --primary-dark:#1d4ed8; --green:#10b981; --red:#ef4444;
      --dark:#1f2937; --gray:#6b7280; --light:#f3f4f6; --line:#e5e7eb; --white:#fff; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      background:var(--light); color:var(--dark); line-height:1.5; }
    header{ background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; padding:16px 24px;
      display:flex; align-items:center; justify-content:space-between; }
    header h1{ font-size:1.4rem; }
    header .who{ font-size:.9rem; opacity:.9; }
    .container{ max-width:1300px; margin:0 auto; padding:20px; }
    button{ cursor:pointer; border:none; border-radius:8px; padding:9px 14px; font-size:14px; font-weight:600; }
    .btn-primary{ background:var(--primary); color:#fff; }
    .btn-green{ background:var(--green); color:#fff; }
    .btn-red{ background:var(--red); color:#fff; }
    .btn-light{ background:#fff; color:var(--dark); border:1px solid var(--line); }
    input,select,textarea{ width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
      font-size:14px; font-family:inherit; background:#fff; }
    label{ font-size:13px; font-weight:600; color:var(--gray); display:block; margin-bottom:4px; }

    /* Login */
    #loginView{ max-width:380px; margin:8vh auto; background:#fff; border-radius:14px; padding:32px;
      box-shadow:0 10px 25px rgba(0,0,0,.08); }
    #loginView h2{ text-align:center; margin-bottom:18px; }
    #loginView .field{ margin-bottom:14px; }
    #loginError{ color:var(--red); text-align:center; margin-top:10px; font-size:14px; min-height:18px; }

    /* Tabs */
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .tab{ background:#fff; color:var(--gray); border:1px solid var(--line); }
    .tab.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
    .panel{ display:none; }
    .panel.active{ display:block; }

    .card{ background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:18px; margin-bottom:16px; }
    .card h3{ margin-bottom:12px; font-size:1.1rem; }
    .filters{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
    .team-card{ border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
    .team-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
    .badges span{ display:inline-block; background:var(--light); border-radius:20px; padding:2px 10px; font-size:12px; margin-right:6px; }
    .players-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
    .players-table th,.players-table td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
    .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
    .inline-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; align-items:end; }
    .muted{ color:var(--gray); font-size:13px; }
    .pill-open{ color:var(--green); font-weight:700; }
    .pill-closed{ color:var(--red); font-weight:700; }
    .list-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .list-row .grow{ flex:1; min-width:160px; }
    .region-block{ border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
    .region-block h4{ font-size:1rem; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
    .sub-section{ margin:10px 0; }
    .sub-section h5{ font-size:.8rem; text-transform:uppercase; color:var(--gray); margin-bottom:6px; }
    .add-inline{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
    .add-inline input{ flex:1; min-width:140px; }
    .toast{ position:fixed; bottom:20px; right:20px; background:var(--dark); color:#fff; padding:12px 18px;
      border-radius:10px; opacity:0; transform:translateY(10px); transition:.25s; z-index:5000; }
    .toast.show{ opacity:1; transform:translateY(0); }
    .checkbox-row{ display:flex; align-items:center; gap:8px; }
    .checkbox-row input{ width:auto; }
    img.poster-preview{ max-width:280px; border-radius:10px; border:1px solid var(--line); margin-top:10px; display:block; }
  </style>
</head>
<body>
  <!-- ============================ LOGIN ============================ -->
  <div id="loginView" style="display:none;">
    <h2>🎱 Admin Login</h2>
    <div class="field"><label>Username</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn-primary" style="width:100%;" id="loginBtn">Sign In</button>
    <div id="loginError"></div>
  </div>

  <!-- ============================ APP ============================ -->
  <div id="appView" style="display:none;">
    <header>
      <h1>🎱 Pool League Dashboard</h1>
      <div>
        <span class="who" id="whoami"></span>
        <button class="btn-light" id="logoutBtn" style="margin-left:12px;">Log out</button>
      </div>
    </header>
    <div class="container">
      <div class="tabs">
        <button class="tab active" data-panel="signups">Signups</button>
        <button class="tab" data-panel="config">Registration Setup</button>
        <button class="tab" data-panel="poster">Home Poster</button>
        <button class="tab" data-panel="admins">Admins</button>
      </div>

      <!-- SIGNUPS -->
      <div class="panel active" id="panel-signups">
        <div class="card">
          <h3>Filter signups</h3>
          <div class="filters">
            <div><label>Region</label><select id="fRegion"></select></div>
            <div><label>Session</label><select id="fSession"></select></div>
            <div><label>Division</label><select id="fDivision"></select></div>
            <div><label>Search team / player</label><input id="fSearch" placeholder="name or email"></div>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn-primary" id="applyFilters">Apply Filters</button>
            <button class="btn-light" id="clearFilters">Clear</button>
            <button class="btn-green" id="emailSelected">Email selected teams</button>
            <span class="muted" id="signupCount" style="align-self:center;"></span>
          </div>
        </div>
        <div id="signupsList"></div>
      </div>

      <!-- CONFIG -->
      <div class="panel" id="panel-config">
        <div class="card">
          <h3>Add a region</h3>
          <div class="add-inline">
            <input id="newRegionName" placeholder="Region name (e.g. Vancouver)">
            <button class="btn-green" id="addRegionBtn">Add Region</button>
          </div>
        </div>
        <div id="configList"></div>
      </div>

      <!-- POSTER -->
      <div class="panel" id="panel-poster">
        <div class="card">
          <h3>Home page poster</h3>
          <p class="muted">This image pops up when visitors load the home page.</p>
          <div class="checkbox-row" style="margin:14px 0;">
            <input type="checkbox" id="posterEnabled"><label for="posterEnabled" style="margin:0;">Show poster on home page</label>
          </div>
          <div class="field" style="margin-bottom:14px;">
            <label>Upload a new poster image (JPG / PNG / GIF / WEBP, max 8MB)</label>
            <input type="file" id="posterFile" accept="image/*">
            <button class="btn-primary" id="uploadPosterBtn" style="margin-top:10px;">Upload</button>
          </div>
          <div class="field">
            <label>…or point to an existing image URL/path</label>
            <div class="add-inline">
              <input id="posterUrl" placeholder="e.g. assets/images/Fall_2025_league.jpg">
              <button class="btn-light" id="savePosterUrlBtn">Save URL</button>
            </div>
          </div>
          <img id="posterPreview" class="poster-preview" alt="" style="display:none;">
        </div>
      </div>

      <!-- ADMINS -->
      <div class="panel" id="panel-admins">
        <div class="card">
          <h3>Add an admin</h3>
          <div class="inline-grid">
            <div><label>Username</label><input id="newAdminUser"></div>
            <div><label>Password</label><input id="newAdminPass" type="text" placeholder="min 4 characters"></div>
            <div><button class="btn-green" id="addAdminBtn">Add Admin</button></div>
          </div>
        </div>
        <div class="card">
          <h3>Current admins</h3>
          <div id="adminsList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  const API = 'api/';
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

  async function api(file, action, opts={}){
    const url = API + file + '?action=' + action;
    const res = await fetch(url, opts);
    let data; try { data = await res.json(); } catch(e){ data = {}; }
    if(!res.ok){ throw new Error(data.error || ('Request failed ('+res.status+')')); }
    return data;
  }
  function post(file, action, body){
    return api(file, action, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  }

  // -------------------------------------------------- auth / bootstrap ----
  async function boot(){
    try{
      const me = await api('auth.php', 'me');
      if(me.loggedIn){ showApp(me.username); } else { showLogin(); }
    }catch(e){ showLogin(); }
  }
  function showLogin(){ document.getElementById('loginView').style.display='block'; document.getElementById('appView').style.display='none'; }
  function showApp(username){
    document.getElementById('loginView').style.display='none';
    document.getElementById('appView').style.display='block';
    document.getElementById('whoami').textContent = 'Signed in as ' + username;
    loadConfigForFilters();
    loadSignups();
  }
  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('loginPass').addEventListener('keyup', e => { if(e.key==='Enter') login(); });
  async function login(){
    const err = document.getElementById('loginError'); err.textContent='';
    try{
      const data = await post('auth.php','login',{ username:document.getElementById('loginUser').value, password:document.getElementById('loginPass').value });
      showApp(data.username);
    }catch(e){ err.textContent = e.message; }
  }
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try{ await post('auth.php','logout',{}); }catch(e){}
    showLogin();
  });

  // -------------------------------------------------- tabs ----
  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.panel).classList.add('active');
    if(tab.dataset.panel==='config') loadConfig();
    if(tab.dataset.panel==='poster') loadPoster();
    if(tab.dataset.panel==='admins') loadAdmins();
  }));

  // -------------------------------------------------- config cache (filters) ----
  let configCache = { regions: [] };
  async function loadConfigForFilters(){
    try{
      const data = await api('admin.php','list_config');
      configCache = data;
      const fRegion = document.getElementById('fRegion');
      // Signups are filtered by the text values stored on each team, so the
      // option VALUES are names (not config IDs).
      fRegion.innerHTML = '<option value="">All regions</option>' +
        data.regions.map(r=>`<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
      updateFilterDependents();
    }catch(e){ /* ignore */ }
  }
  document.getElementById('fRegion').addEventListener('change', updateFilterDependents);
  function updateFilterDependents(){
    const rname = document.getElementById('fRegion').value;
    const region = configCache.regions.find(r=>r.name===rname);
    const fSession = document.getElementById('fSession');
    const fDivision = document.getElementById('fDivision');
    const sessions = region ? region.sessions : configCache.regions.flatMap(r=>r.sessions);
    const divisions = region ? region.divisions : configCache.regions.flatMap(r=>r.divisions);
    const uniq = arr => [...new Set(arr)];
    fSession.innerHTML = '<option value="">All sessions</option>' + uniq(sessions.map(s=>s.name)).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
    fDivision.innerHTML = '<option value="">All divisions</option>' + uniq(divisions.map(d=>d.name)).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  }

  // -------------------------------------------------- signups ----
  document.getElementById('applyFilters').addEventListener('click', loadSignups);
  document.getElementById('clearFilters').addEventListener('click', () => {
    document.getElementById('fRegion').value=''; updateFilterDependents();
    document.getElementById('fSession').value=''; document.getElementById('fDivision').value='';
    document.getElementById('fSearch').value=''; loadSignups();
  });
  document.getElementById('fSearch').addEventListener('keyup', e=>{ if(e.key==='Enter') loadSignups(); });

  let signupsData = [];
  async function loadSignups(){
    const params = new URLSearchParams({ action:'list_signups' });
    const region=document.getElementById('fRegion').value, session=document.getElementById('fSession').value,
          division=document.getElementById('fDivision').value, q=document.getElementById('fSearch').value.trim();
    if(region) params.set('region',region); if(session) params.set('session',session);
    if(division) params.set('division',division); if(q) params.set('q',q);
    const list = document.getElementById('signupsList');
    list.innerHTML = '<p class="muted">Loading…</p>';
    try{
      const res = await fetch(API+'admin.php?'+params.toString());
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      signupsData = data.teams || [];
      renderSignups();
    }catch(e){ list.innerHTML = '<p class="muted">'+esc(e.message)+'</p>'; }
  }

  function renderSignups(){
    const list = document.getElementById('signupsList');
    document.getElementById('signupCount').textContent = signupsData.length + ' team(s)';
    if(!signupsData.length){ list.innerHTML='<div class="card"><p class="muted">No signups match your filters.</p></div>'; return; }
    list.innerHTML = signupsData.map(t => teamCardHtml(t)).join('');
  }

  function teamCardHtml(t){
    const players = (t.players||[]).map(p => `
      <tr>
        <td><input value="${esc(p.name)}" data-pf="name" data-pid="${p.id}"></td>
        <td><input value="${esc(p.email)}" data-pf="email" data-pid="${p.id}"></td>
        <td><input value="${esc(p.phone)}" data-pf="phone" data-pid="${p.id}"></td>
        <td class="row-actions">
          <button class="btn-light" onclick="savePlayer(${p.id})">Save</button>
          <button class="btn-red" onclick="deletePlayer(${p.id})">✕</button>
        </td>
      </tr>`).join('');
    return `
    <div class="card team-card" id="team-${t.id}">
      <div class="team-head">
        <div class="checkbox-row">
          <input type="checkbox" class="team-select" value="${t.id}">
          <strong>${esc(t.team_name)}</strong>
        </div>
        <div class="badges">
          <span>${esc(t.region_name||'—')}</span>
          <span>${esc(t.session_name||'—')}</span>
          <span>${esc(t.division_name||'—')}</span>
          <span>${(t.players||[]).length} players</span>
        </div>
      </div>
      <div class="inline-grid" style="margin-top:12px;">
        <div><label>Team name</label><input data-tf="team_name" data-tid="${t.id}" value="${esc(t.team_name)}"></div>
        <div><label>Session</label><input data-tf="session_name" data-tid="${t.id}" value="${esc(t.session_name)}"></div>
        <div><label>Division</label><input data-tf="division_name" data-tid="${t.id}" value="${esc(t.division_name)}"></div>
        <div><label>Home bar 1</label><input data-tf="home_bar_first" data-tid="${t.id}" value="${esc(t.home_bar_first)}"></div>
        <div><label>Home bar 2</label><input data-tf="home_bar_second" data-tid="${t.id}" value="${esc(t.home_bar_second)}"></div>
      </div>
      <div class="row-actions" style="margin-top:10px;">
        <button class="btn-primary" onclick="saveTeam(${t.id})">Save team</button>
        <button class="btn-red" onclick="deleteTeam(${t.id})">Delete team</button>
        <span class="muted" style="align-self:center;">Registered: ${esc(t.registration_date||'')}</span>
      </div>
      <table class="players-table">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr></thead>
        <tbody>${players}</tbody>
      </table>
      <div class="add-inline" style="margin-top:10px;">
        <input id="np-name-${t.id}" placeholder="New player name">
        <input id="np-email-${t.id}" placeholder="Email">
        <input id="np-phone-${t.id}" placeholder="Phone">
        <button class="btn-green" onclick="addPlayer(${t.id})">+ Add player</button>
      </div>
    </div>`;
  }

  async function saveTeam(id){
    const card = document.getElementById('team-'+id);
    const body = { id };
    card.querySelectorAll('[data-tf][data-tid="'+id+'"]').forEach(el => body[el.dataset.tf]=el.value);
    try{ await post('admin.php','update_team',body); toast('Team saved'); }catch(e){ toast(e.message); }
  }
  async function deleteTeam(id){
    if(!confirm('Delete this team and all its players?')) return;
    try{ await post('admin.php','delete_team',{id}); toast('Team deleted'); loadSignups(); }catch(e){ toast(e.message); }
  }
  async function savePlayer(pid){
    const card = document.getElementById('signupsList');
    const get = f => card.querySelector('[data-pf="'+f+'"][data-pid="'+pid+'"]').value;
    try{ await post('admin.php','update_player',{ id:pid, name:get('name'), email:get('email'), phone:get('phone') }); toast('Player saved'); }catch(e){ toast(e.message); }
  }
  async function deletePlayer(pid){
    if(!confirm('Delete this player?')) return;
    try{ await post('admin.php','delete_player',{id:pid}); toast('Player deleted'); loadSignups(); }catch(e){ toast(e.message); }
  }
  async function addPlayer(tid){
    const name=document.getElementById('np-name-'+tid).value, email=document.getElementById('np-email-'+tid).value, phone=document.getElementById('np-phone-'+tid).value;
    if(!name && !email && !phone){ toast('Enter player details first'); return; }
    try{ await post('admin.php','add_player',{ team_id:tid, name, email, phone }); toast('Player added'); loadSignups(); }catch(e){ toast(e.message); }
  }

  // -------------------------------------------------- email ----
  document.getElementById('emailSelected').addEventListener('click', async () => {
    const ids = [...document.querySelectorAll('.team-select:checked')].map(c=>parseInt(c.value));
    if(!ids.length){ toast('Select at least one team (checkbox)'); return; }
    const subject = prompt('Email subject:'); if(subject===null) return;
    const message = prompt('Message to send to all players on the selected teams:'); if(message===null) return;
    if(!subject.trim() || !message.trim()){ toast('Subject and message required'); return; }
    try{
      const r = await post('admin.php','send_email',{ team_ids:ids, subject, message });
      toast(`Sent to ${r.sent}/${r.recipients} recipients`);
    }catch(e){ toast(e.message); }
  });

  // -------------------------------------------------- config CRUD ----
  async function loadConfig(){
    const wrap = document.getElementById('configList');
    wrap.innerHTML = '<p class="muted">Loading…</p>';
    try{
      const data = await api('admin.php','list_config');
      configCache = data;
      wrap.innerHTML = data.regions.map(regionBlockHtml).join('') || '<p class="muted">No regions yet.</p>';
    }catch(e){ wrap.innerHTML = '<p class="muted">'+esc(e.message)+'</p>'; }
  }
  function regionBlockHtml(r){
    return `
    <div class="card region-block">
      <h4>
        <span>${esc(r.name)} <span class="muted">(${esc(r.slug)})</span> ${r.active==1?'':'<span class="pill-closed">· hidden</span>'}</span>
        <span class="row-actions">
          <button class="btn-light" onclick="renameRegion(${r.id},'${esc(r.name).replace(/'/g,"\\'")}')">Rename</button>
          <button class="btn-light" onclick="toggleRegion(${r.id}, ${r.active==1?0:1})">${r.active==1?'Hide':'Show'}</button>
          <button class="btn-red" onclick="deleteRegion(${r.id})">Delete region</button>
        </span>
      </h4>

      <div class="sub-section">
        <h5>Sessions (open / close registration)</h5>
        ${(r.sessions||[]).map(s=>`
          <div class="list-row">
            <span class="grow">${esc(s.name)} — <span class="${s.is_open==1?'pill-open':'pill-closed'}">${s.is_open==1?'OPEN':'CLOSED'}</span></span>
            <button class="btn-light" onclick="renameSession(${s.id},'${esc(s.name).replace(/'/g,"\\'")}')">Rename</button>
            <button class="${s.is_open==1?'btn-red':'btn-green'}" onclick="toggleSession(${s.id}, ${s.is_open==1?0:1})">${s.is_open==1?'Close':'Open'}</button>
            <button class="btn-red" onclick="deleteItem('delete_session',${s.id})">✕</button>
          </div>`).join('') || '<p class="muted">No sessions.</p>'}
        <div class="add-inline"><input id="ns-${r.id}" placeholder="New session name"><button class="btn-green" onclick="addSession(${r.id})">Add session</button></div>
      </div>

      <div class="sub-section">
        <h5>Day / Division options</h5>
        ${(r.divisions||[]).map(d=>`
          <div class="list-row">
            <input class="grow" value="${esc(d.name)}" id="dv-${d.id}">
            <button class="btn-light" onclick="saveDivision(${d.id})">Save</button>
            <button class="btn-red" onclick="deleteItem('delete_division',${d.id})">✕</button>
          </div>`).join('') || '<p class="muted">No divisions.</p>'}
        <div class="add-inline"><input id="nd-${r.id}" placeholder="New division (e.g. MONDAY A+)"><button class="btn-green" onclick="addDivision(${r.id})">Add division</button></div>
      </div>

      <div class="sub-section">
        <h5>Locations (registerable bars — also shown on the Locations page)</h5>
        ${(r.locations||[]).map(l=>`
          <div class="list-row">
            <input class="grow" value="${esc(l.name)}" id="lc-name-${l.id}" placeholder="Name">
            <input class="grow" value="${esc(l.address)}" id="lc-addr-${l.id}" placeholder="Address (optional)">
            <input class="grow" value="${esc(l.map_embed)}" id="lc-embed-${l.id}" placeholder="Map embed URL or <iframe> (optional)">
            <button class="${l.active==1?'btn-light':'btn-green'}" onclick="toggleLocation(${l.id}, ${l.active==1?0:1})">${l.active==1?'Active':'Hidden'}</button>
            <button class="btn-light" onclick="saveLocation(${l.id})">Save</button>
            <button class="btn-red" onclick="deleteItem('delete_location',${l.id})">✕</button>
          </div>`).join('') || '<p class="muted">No locations.</p>'}
        <div class="add-inline">
          <input id="nl-name-${r.id}" placeholder="New location name">
          <input id="nl-addr-${r.id}" placeholder="Address">
          <input id="nl-embed-${r.id}" placeholder="Map embed (optional)">
          <button class="btn-green" onclick="addLocation(${r.id})">Add location</button>
        </div>
        <div style="margin-top:10px;">
          <label>Bulk add — one location per line (optionally <code>Name | Address | Map embed</code>)</label>
          <textarea id="bulk-${r.id}" rows="4" placeholder="Cat and Fiddle Pub&#10;Hey Hey's | Surrey&#10;Boomers"></textarea>
          <button class="btn-green" style="margin-top:6px;" onclick="bulkAddLocations(${r.id})">Bulk add locations</button>
        </div>
      </div>
    </div>`;
  }

  async function bulkAddLocations(rid){
    const text = document.getElementById('bulk-'+rid).value;
    if(!text.trim()){ toast('Paste at least one location'); return; }
    try{ const r = await post('admin.php','bulk_add_locations',{region_id:rid, text}); toast('Added '+r.added+' location(s)'); loadConfig(); }catch(e){ toast(e.message); }
  }

  document.getElementById('addRegionBtn').addEventListener('click', async () => {
    const name = document.getElementById('newRegionName').value.trim();
    if(!name){ toast('Enter a region name'); return; }
    try{ await post('admin.php','add_region',{name}); document.getElementById('newRegionName').value=''; toast('Region added'); loadConfig(); loadConfigForFilters(); }catch(e){ toast(e.message); }
  });
  async function renameRegion(id, current){ const name=prompt('Region name:',current); if(!name) return; try{ await post('admin.php','update_region',{id,name,active:1}); loadConfig(); loadConfigForFilters(); }catch(e){ toast(e.message);} }
  async function toggleRegion(id, active){ try{ const r=configCache.regions.find(x=>x.id==id); await post('admin.php','update_region',{id,name:r.name,active}); loadConfig(); loadConfigForFilters(); }catch(e){ toast(e.message);} }
  async function deleteRegion(id){ if(!confirm('Delete this region and ALL its sessions, divisions and locations? (Signups are kept.)')) return; try{ await post('admin.php','delete_region',{id}); toast('Region deleted'); loadConfig(); loadConfigForFilters(); }catch(e){ toast(e.message);} }

  async function addSession(rid){ const el=document.getElementById('ns-'+rid); const name=el.value.trim(); if(!name){toast('Enter a session name');return;} try{ await post('admin.php','add_session',{region_id:rid,name}); el.value=''; toast('Session added'); loadConfig(); }catch(e){ toast(e.message);} }
  async function renameSession(id,current){ const name=prompt('Session name:',current); if(!name) return; try{ await post('admin.php','update_session',{id,name}); loadConfig(); }catch(e){ toast(e.message);} }
  async function toggleSession(id,is_open){ try{ await post('admin.php','toggle_session',{id,is_open}); toast(is_open?'Session opened':'Session closed'); loadConfig(); }catch(e){ toast(e.message);} }

  async function addDivision(rid){ const el=document.getElementById('nd-'+rid); const name=el.value.trim(); if(!name){toast('Enter a division');return;} try{ await post('admin.php','add_division',{region_id:rid,name}); el.value=''; toast('Division added'); loadConfig(); }catch(e){ toast(e.message);} }
  async function saveDivision(id){ const name=document.getElementById('dv-'+id).value.trim(); try{ await post('admin.php','update_division',{id,name,active:1}); toast('Division saved'); }catch(e){ toast(e.message);} }

  async function addLocation(rid){
    const name=document.getElementById('nl-name-'+rid).value.trim();
    if(!name){toast('Enter a location name');return;}
    const address=document.getElementById('nl-addr-'+rid).value.trim();
    const map_embed=document.getElementById('nl-embed-'+rid).value.trim();
    try{ await post('admin.php','add_location',{region_id:rid,name,address,map_embed}); toast('Location added'); loadConfig(); }catch(e){ toast(e.message);} }
  async function saveLocation(id){
    const name=document.getElementById('lc-name-'+id).value.trim();
    const address=document.getElementById('lc-addr-'+id).value.trim();
    const map_embed=document.getElementById('lc-embed-'+id).value.trim();
    const l = configCache.regions.flatMap(r=>r.locations).find(x=>x.id==id);
    try{ await post('admin.php','update_location',{id,name,address,map_embed,active:l?l.active:1}); toast('Location saved'); }catch(e){ toast(e.message);} }
  async function toggleLocation(id,active){ const l=configCache.regions.flatMap(r=>r.locations).find(x=>x.id==id); try{ await post('admin.php','update_location',{id,name:l.name,address:l.address,map_embed:l.map_embed,active}); loadConfig(); }catch(e){ toast(e.message);} }
  async function deleteItem(action,id){ if(!confirm('Delete this item?')) return; try{ await post('admin.php',action,{id}); toast('Deleted'); loadConfig(); }catch(e){ toast(e.message);} }

  // -------------------------------------------------- poster ----
  async function loadPoster(){
    try{
      const data = await api('public.php','poster');
      document.getElementById('posterEnabled').checked = !!data.enabled;
      document.getElementById('posterUrl').value = data.url || '';
      const prev = document.getElementById('posterPreview');
      if(data.url){ prev.src = data.url; prev.style.display='block'; } else { prev.style.display='none'; }
    }catch(e){}
  }
  document.getElementById('posterEnabled').addEventListener('change', async (e) => {
    try{ await post('admin.php','set_poster',{ enabled: e.target.checked ? 1 : 0 }); toast('Saved'); }catch(err){ toast(err.message); }
  });
  document.getElementById('savePosterUrlBtn').addEventListener('click', async () => {
    const url = document.getElementById('posterUrl').value.trim();
    try{ await post('admin.php','set_poster',{ url }); toast('Poster URL saved'); loadPoster(); }catch(e){ toast(e.message); }
  });
  document.getElementById('uploadPosterBtn').addEventListener('click', async () => {
    const f = document.getElementById('posterFile').files[0];
    if(!f){ toast('Choose a file first'); return; }
    const fd = new FormData(); fd.append('poster', f);
    try{
      const res = await fetch(API+'admin.php?action=upload_poster',{ method:'POST', body:fd });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error||'Upload failed');
      toast('Poster uploaded'); loadPoster();
    }catch(e){ toast(e.message); }
  });

  // -------------------------------------------------- admins ----
  async function loadAdmins(){
    const wrap = document.getElementById('adminsList');
    wrap.innerHTML = '<p class="muted">Loading…</p>';
    try{
      const data = await api('admin.php','list_admins');
      wrap.innerHTML = data.admins.map(a => `
        <div class="list-row">
          <span class="grow"><strong>${esc(a.username)}</strong> <span class="muted">· added ${esc((a.created_at||'').split(' ')[0])}</span></span>
          <button class="btn-red" onclick="deleteAdmin(${a.id})">Remove</button>
        </div>`).join('');
    }catch(e){ wrap.innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }
  }
  document.getElementById('addAdminBtn').addEventListener('click', async () => {
    const username=document.getElementById('newAdminUser').value.trim(), password=document.getElementById('newAdminPass').value;
    if(!username || password.length<4){ toast('Username required, password min 4 chars'); return; }
    try{ await post('admin.php','add_admin',{username,password}); document.getElementById('newAdminUser').value=''; document.getElementById('newAdminPass').value=''; toast('Admin added'); loadAdmins(); }catch(e){ toast(e.message); }
  });
  async function deleteAdmin(id){ if(!confirm('Remove this admin?')) return; try{ await post('admin.php','delete_admin',{id}); toast('Admin removed'); loadAdmins(); }catch(e){ toast(e.message); } }

  boot();
  </script>
</body>
</html>
